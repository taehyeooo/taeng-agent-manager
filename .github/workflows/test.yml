name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 승인 기록 비교에 이전 커밋이 필요하다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git identity for test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: python -m unittest discover -s tests -v
      - name: approvals are append-only
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_approvals.py "$BASE" HEAD
